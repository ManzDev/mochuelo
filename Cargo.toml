[package]
name = "oc-observe"
version = "0.1.0"
edition = "2021"
description = "Turn an OpenCode session export into a beautiful standalone HTML page"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
